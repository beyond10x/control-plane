name: check

on:
  pull_request:
  push:
    branches: [main, 'control-plane/**']

permissions:
  contents: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  check:
    name: control-plane / task check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install task
        env:
          TOOL_VERSION: '3.52.0'
          TOOL_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TOOL_VERSION/task_linux_amd64.tar.gz"
          echo "$TOOL_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"
      - name: Install foundation CLIs
        run: |
          set -euo pipefail
          while read -r tool version checksum; do
            asset="$tool-$version-x86_64-unknown-linux-gnu"
            curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$asset.tar.gz" \
              "https://github.com/beyond10x/$tool/releases/download/$version/$asset.tar.gz"
            echo "$checksum  $RUNNER_TEMP/$asset.tar.gz" | sha256sum --check --strict
            tar -xzf "$RUNNER_TEMP/$asset.tar.gz" -C "$RUNNER_TEMP"
            echo "$RUNNER_TEMP/$asset" >> "$GITHUB_PATH"
          done <<'TOOLS'
          ess 0.53.0 40e8c9acd9bb5016387215cb5461090eb4765805ce7c8858d4b02284e6908914
          aep 0.68.0 02bf6a2c4bc9a3ffd717edfb365f665491005004f159774a8847d3cbd18c5e91
          worktree 0.8.2 8be61b3ee06e3a49c02416b52f5269e270846c105432ef3c2f5b63f30241b737
          TOOLS
      - name: Validate and qualify
        run: task check
