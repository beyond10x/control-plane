domain: controlplane.host
summary: Local workspace goals and assignments; AEP owns stories, Loom owns agent executions.
entities:
  - name: controlplane.host.Workspace
    identity:
      name: workspace_id
      type: Uuid
    fields:
      - name: path
        type: String
      - name: name
        type: String
    lifecycle:
      initial: Registered
      states:
        - Registered
        - Archived
      terminal:
        - Archived
      transitions:
        - name: archive
          from:
            - Registered
          to: Archived
    relations:
      - name: repositories
        kind: owns
        target: controlplane.host.RepositoryRegistration
        cardinality: many
        via: workspace_id
      - name: goals
        kind: owns
        target: controlplane.host.Goal
        cardinality: many
        via: workspace_id
  - name: controlplane.host.RepositoryRegistration
    identity:
      name: repository_id
      type: Uuid
    fields:
      - name: workspace_id
        type: Uuid
      - name: name
        type: String
      - name: path
        type: String
      - name: common_dir
        type: String
      - name: base_branch
        type: String
      - name: test_command
        type: String
      - name: publish_command
        type: String
    lifecycle:
      initial: Registered
      states:
        - Registered
        - Disabled
      terminal: []
      transitions:
        - name: disable
          from:
            - Registered
          to: Disabled
        - name: enable
          from:
            - Disabled
          to: Registered
  - name: controlplane.host.Goal
    identity:
      name: goal_id
      type: Uuid
    fields:
      - name: workspace_id
        type: Uuid
      - name: objective
        type: String
      - name: acceptance
        type: String
      - name: max_workers
        type: Integer
      - name: max_attempts
        type: Integer
      - name: max_minutes
        type: Integer
      - name: planner_model
        type: String
      - name: implementor_model
        type: String
      - name: reviewer_model
        type: String
      - name: merge_authority
        type: Boolean
    lifecycle:
      initial: Paused
      states:
        - Paused
        - Running
        - Satisfied
        - Cancelled
      terminal:
        - Satisfied
        - Cancelled
      transitions:
        - name: start
          from:
            - Paused
          to: Running
        - name: pause
          from:
            - Running
          to: Paused
        - name: satisfy
          from:
            - Running
          to: Satisfied
        - name: cancel
          from:
            - Running
            - Paused
          to: Cancelled
    relations:
      - name: assignments
        kind: owns
        target: controlplane.host.Assignment
        cardinality: many
        via: goal_id
  - name: controlplane.host.Assignment
    identity:
      name: assignment_id
      type: Uuid
    fields:
      - name: goal_id
        type: Uuid
      - name: repository_id
        type: Uuid
      - name: story_id
        type: String
      - name: case_id
        type: String
      - name: worktree_id
        type: String
      - name: candidate
        type: String
      - name: attempt
        type: Integer
      - name: reason
        type: String
      - name: implementor_run
        type: String
      - name: reviewer_run
        type: String
    lifecycle:
      initial: Queued
      states:
        - Queued
        - Implementing
        - Reviewing
        - ReadyToMerge
        - Merging
        - Merged
        - Blocked
        - Cancelled
      terminal:
        - Merged
        - Cancelled
      transitions:
        - name: claim
          from:
            - Queued
          to: Implementing
        - name: review
          from:
            - Implementing
          to: Reviewing
        - name: repair
          from:
            - Reviewing
            - Blocked
          to: Implementing
        - name: ready
          from:
            - Reviewing
          to: ReadyToMerge
        - name: merge
          from:
            - ReadyToMerge
          to: Merging
        - name: complete
          from:
            - Merging
          to: Merged
        - name: block
          from:
            - Queued
            - Implementing
            - Reviewing
            - ReadyToMerge
            - Merging
          to: Blocked
        - name: cancel
          from:
            - Queued
            - Implementing
            - Reviewing
            - ReadyToMerge
            - Blocked
          to: Cancelled
    relations:
      - name: repository
        kind: references
        target: controlplane.host.RepositoryRegistration
        cardinality: one
        via: repository_id
actors:
  - name: controlplane.host.Operator
    may:
      - controlplane.host.RegisterWorkspace
      - controlplane.host.ArchiveWorkspace
      - controlplane.host.RegisterRepository
      - controlplane.host.DisableRepositoryRegistration
      - controlplane.host.EnableRepositoryRegistration
      - controlplane.host.CreateGoal
      - controlplane.host.StartGoal
      - controlplane.host.PauseGoal
      - controlplane.host.CancelGoal
  - name: controlplane.host.Supervisor
    may:
      - controlplane.host.RegisterWorkspace
      - controlplane.host.ArchiveWorkspace
      - controlplane.host.RegisterRepository
      - controlplane.host.DisableRepositoryRegistration
      - controlplane.host.EnableRepositoryRegistration
      - controlplane.host.CreateGoal
      - controlplane.host.StartGoal
      - controlplane.host.PauseGoal
      - controlplane.host.SatisfyGoal
      - controlplane.host.CancelGoal
      - controlplane.host.QueueAssignment
      - controlplane.host.ClaimAssignment
      - controlplane.host.ReviewAssignment
      - controlplane.host.RepairAssignment
      - controlplane.host.ReadyAssignment
      - controlplane.host.MergeAssignment
      - controlplane.host.CompleteAssignment
      - controlplane.host.BlockAssignment
      - controlplane.host.CancelAssignment
errors:
  - name: controlplane.host.WorkspaceStateConflict
    summary: The command cannot act in the current state.
    fields:
      - name: state
        type: controlplane.host.Workspace.State
  - name: controlplane.host.WorkspaceNotFound
    summary: The requested identity is not held.
    fields: []
  - name: controlplane.host.RepositoryRegistrationStateConflict
    summary: The command cannot act in the current state.
    fields:
      - name: state
        type: controlplane.host.RepositoryRegistration.State
  - name: controlplane.host.RepositoryRegistrationNotFound
    summary: The requested identity is not held.
    fields: []
  - name: controlplane.host.GoalStateConflict
    summary: The command cannot act in the current state.
    fields:
      - name: state
        type: controlplane.host.Goal.State
  - name: controlplane.host.GoalNotFound
    summary: The requested identity is not held.
    fields: []
  - name: controlplane.host.AssignmentStateConflict
    summary: The command cannot act in the current state.
    fields:
      - name: state
        type: controlplane.host.Assignment.State
  - name: controlplane.host.AssignmentNotFound
    summary: The requested identity is not held.
    fields: []
commands:
  - name: controlplane.host.RegisterWorkspace
    input:
      - name: path
        type: String
      - name: name
        type: String
    outcomes:
      - name: created
        creates: controlplane.host.Workspace
        instance: workspace_id
        sets:
          path: input.path
          name: input.name
        emits:
          - controlplane.host.WorkspaceCreated
        payload:
          controlplane.host.WorkspaceCreated:
            path: input.path
            name: input.name
            workspace_id:
              generated: true
  - name: controlplane.host.ArchiveWorkspace
    input:
      - name: workspace_id
        type: Uuid
    outcomes:
      - name: applied
        moves: controlplane.host.Workspace.archive
        instance: workspace_id
        emits:
          - controlplane.host.ArchiveWorkspaceApplied
        payload:
          controlplane.host.ArchiveWorkspaceApplied:
            workspace_id: input.workspace_id
      - name: wrong-state
        wrong_state: true
        error: controlplane.host.WorkspaceStateConflict
      - name: not-found
        unknown_instance: true
        error: controlplane.host.WorkspaceNotFound
  - name: controlplane.host.RegisterRepository
    input:
      - name: workspace_id
        type: Uuid
      - name: name
        type: String
      - name: path
        type: String
      - name: common_dir
        type: String
      - name: base_branch
        type: String
      - name: test_command
        type: String
      - name: publish_command
        type: String
    outcomes:
      - name: created
        creates: controlplane.host.RepositoryRegistration
        instance: repository_id
        sets:
          workspace_id: input.workspace_id
          name: input.name
          path: input.path
          common_dir: input.common_dir
          base_branch: input.base_branch
          test_command: input.test_command
          publish_command: input.publish_command
        emits:
          - controlplane.host.RepositoryRegistrationCreated
        payload:
          controlplane.host.RepositoryRegistrationCreated:
            workspace_id: input.workspace_id
            name: input.name
            path: input.path
            common_dir: input.common_dir
            base_branch: input.base_branch
            test_command: input.test_command
            publish_command: input.publish_command
            repository_id:
              generated: true
  - name: controlplane.host.DisableRepositoryRegistration
    input:
      - name: repository_id
        type: Uuid
    outcomes:
      - name: applied
        moves: controlplane.host.RepositoryRegistration.disable
