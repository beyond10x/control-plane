            repository_id: input.repository_id
      - name: wrong-state
        wrong_state: true
        error: controlplane.host.RepositoryRegistrationStateConflict
      - name: not-found
        unknown_instance: true
        error: controlplane.host.RepositoryRegistrationNotFound
